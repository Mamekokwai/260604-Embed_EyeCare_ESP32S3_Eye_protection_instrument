# EyeCare 生产固件烧写配置
# 命令行参数会覆盖这里的 PORT、BAUD、BUILD_DIR。
# CONFIRM_PRODUCTION_FLASH=1 会跳过确认提示，只建议用于已审核的固定烧写环境。

# 原生 USB Serial-JTAG 端口；留空时自动识别 VID_303A&PID_1001。
PORT=COM17

# esptool 波特率。
BAUD=460800

# 生产构建目录，相对于项目根目录。
BUILD_DIR=build-production

# 0：每次要求输入 FLASH-PRODUCTION；1：跳过确认提示。
CONFIRM_PRODUCTION_FLASH=0
